name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14

      - name: Resolve dependencies
        run: dart pub get

      - name: Format, analyze and test
        run: dart run tool/check.dart
