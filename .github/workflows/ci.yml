name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The tool of the ecosystem that reads the reflection of a gRPC server.
      # The test of the reflection calls it, so the reflection is checked
      # against a tool of the ecosystem and not only against the runtime.
      - name: Install grpcurl
        shell: bash
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: dart pub get

      - name: Format, analyze and test
        run: dart run tool/check.dart
