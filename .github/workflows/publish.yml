name: Publish

# The packages are published on pub.dev by hand: the publishing cannot be
# undone, and the analysis of pub.dev takes its time. The secret `PUB_TOKEN`
# of the publisher is read from the secrets of the repository.
#
# The run is started from the page of the workflow, or with the API:
#
#   gh workflow run publish.yml
#
# The packages are published in the order of their dependencies, so the
# packages that depend on the others come last.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish the packages on pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14'

      - name: Resolve the dependencies
        run: dart pub get

      - name: Run the checks of the repository
        run: dart run tool/check.dart

      - name: Publish the packages
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: dart run tool/publish.dart --all
