name: Release

# A release is a tag: `git tag v0.1.0` and `git push --tags`. The tag builds
# the binaries of the command line interface for every platform, publishes the
# packages on pub.dev and opens the release of the repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: The tag matches the version of the packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read the version of the packages
        run: |
          version=$(grep '^version:' packages/laska_cli/pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version of the packages."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14'

      - name: Resolve the dependencies
        run: dart pub get

      - name: Build the bundle of the command line interface
        working-directory: packages/laska_cli
        run: dart build cli --target bin/laska.dart -o build/cli

      - name: Check that the bundle answers
        working-directory: packages/laska_cli
        shell: bash
        run: |
          ls -R build/cli/bundle
          ./build/cli/bundle/bin/laska* --help

      - name: Pack the bundle
        shell: bash
        run: |
          cd packages/laska_cli/build/cli/bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'bin','lib' -DestinationPath 'laska-${{ matrix.target }}.zip' -Force"
          else
            zip -r "laska-${{ matrix.target }}.zip" bin lib
          fi

      - name: Write the checksum of the bundle
        shell: bash
        run: |
          cd packages/laska_cli/build/cli/bundle
          sha256sum "laska-${{ matrix.target }}.zip" > "laska-${{ matrix.target }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: laska-${{ matrix.target }}
          path: |
            packages/laska_cli/build/cli/bundle/laska-${{ matrix.target }}.zip
            packages/laska_cli/build/cli/bundle/laska-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish the packages on pub.dev
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The token of pub.dev is a temporary one, which GitHub signs for the
      # audience of pub.dev. There is no long lived secret in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14'

      - name: Resolve the dependencies
        run: dart pub get

      - name: Run the checks of the repository
        run: dart run tool/check.dart

      - name: Take the token of pub.dev
        id: token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://pub.dev');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Publish the packages
        env:
          PUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          dart pub token add https://pub.dev --env-var=PUB_TOKEN
          # A package that depends on another one waits for the version of it to
          # reach the index of pub.dev, and the index needs a moment for it. The
          # publisher is re-runnable: a package that is published already is
          # left alone, so a retry publishes only what is missing.
          for attempt in 1 2 3 4 5 6; do
            if dart run tool/publish.dart --all --force; then
              exit 0
            fi
            echo "the publication did not finish; the index of pub.dev may not know the new version yet. Retry in 60s."
            sleep 60
          done
          exit 1

  release:
    name: Open the release
    needs: [check, binaries]
    runs-on: ubuntu-latest
    steps:
      # The command of the GitHub CLI reads the tag from the repository, so the
      # sources are needed here, and the whole history of them with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums of every bundle
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Laska $TAG" --generate-notes --verify-tag
          fi
          # A release that lost its tag stays a draft, and a draft is invisible
          # to the readers of the releases. The release of the tag is published
          # either way.
          gh release edit "$TAG" --draft=false
