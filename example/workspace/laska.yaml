services:
  - name: shop
    entrypoint: services/shop/bin/server.dart
    port: 8080
  - name: shop_gateway
    entrypoint: services/shop_gateway/bin/server.dart
    port: 8081
    depends_on: [shop]
  - name: admin
    kind: app
    entrypoint: apps/admin/bin/server.dart
    port: 8082
    depends_on: [shop_gateway]
