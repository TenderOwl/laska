syntax = "proto3";

package users.v1;

import "google/api/annotations.proto";

// UsersService manages the accounts of the application.
service UsersService {
  // The policy of the calls to the service.
  option (laska.policy) = {
    timeout_ms: 2000
    max_attempts: 3
    backoff_ms: 100
    max_backoff_ms: 2000
    jitter: true
  };

  // GetUser returns a single user by its identifier.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = { get: "/v1/users/{id}" };
    option (laska.policy) = { idempotent: true };
  }

  // ListUsers returns a page of users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/v1/users" };
    option (laska.policy) = { idempotent: true };
  }

  // CreateUser creates a new user.
  //
  // The call changes something, so it is never retried.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = { post: "/v1/users" body: "*" };
  }
}

// A user of the application.
message User {
  // Stable identifier of the user.
  string id = 1;

  // Email address of the user.
  string email = 2;

  // Human readable name.
  string display_name = 3;

  // Role of the user.
  UserRole role = 4;

  // Free form tags.
  repeated string tags = 5;
}

// The role a user has.
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_MEMBER = 2;
}

// Request of the GetUser method.
message GetUserRequest {
  string id = 1;
}

// Request of the ListUsers method.
message ListUsersRequest {
  int32 limit = 1;
  string cursor = 2;
}

// Response of the ListUsers method.
message ListUsersResponse {
  repeated User users = 1;
  string next_cursor = 2;
}

// Request of the CreateUser method.
message CreateUserRequest {
  string email = 1;
  string display_name = 2;
  UserRole role = 3;
}

// A subscription of a user to a plan.
//
// The message holds the constructs a contract needs the most: a message
// declared inside a message, an enum declared inside a message, a map and a
// group of a oneof.
message Subscription {
  // The plan of the subscription.
  message Plan {
    string name = 1;
    int32 seats = 2;
  }

  // The state of the subscription.
  enum State {
    SUBSCRIPTION_STATE_ACTIVE = 0;
    SUBSCRIPTION_STATE_PAUSED = 1;
  }

  // The plan of the subscription.
  Plan plan = 1;

  // The state of the subscription.
  State state = 2;

  // The features of the plan, by their name.
  map<string, bool> features = 3;

  // How the subscription is paid.
  oneof payment {
    string card_token = 4;
    string iban = 5;
  }
}
